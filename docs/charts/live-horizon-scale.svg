  <text x="32" y="55" font-size="11.8" font-weight="450" fill="#475569">Linear turn-count comparison across live benchmarks: external memory SOTA ends at ~300T-308T pairs, while AME runs 5,000 EN turns (16.2x-16.7x)</text>
