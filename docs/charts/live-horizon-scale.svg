<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 455" width="980" height="455" role="img" aria-label="Live Benchmark Horizon Scale [4T -&gt; 5,000T]: Single Continuous Conversation Turns">
  <defs>
