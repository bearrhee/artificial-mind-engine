[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ame-sdk"
version = "1.0.0"
description = "Zero-dependency Python 3.10+ SDK for Artificial Mind Engine (AME) with Mode A/B execution, swappable LLM adapters, and domain profiles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Artificial Mind Engine (thesoulthread / bearrhee)" }
]
keywords = [
  "artificial-mind-engine",
  "cognitive-architecture",
  "llm-sdk",
  "free-energy-principle",
  "npc",
  "companion-ai",
  "memory-revocation"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["ame_sdk*"]
